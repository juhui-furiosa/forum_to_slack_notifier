apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-watcher
  namespace: group-tech-sales
  labels:
    app: forum-watcher
spec:
  replicas: 1
  # 상태 파일 PVC(RWO)를 하나만 붙이고, 교체 중 두 개가 같은 알림을 보내지 않게
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forum-watcher
  template:
    metadata:
      labels:
        app: forum-watcher
    spec:
      nodeSelector:
        furiosa.ai/nodegroup: ondemand-light
      containers:
      - name: forum-watcher
        image: 408994520673.dkr.ecr.ap-northeast-2.amazonaws.com/tech-sales/forum-watcher:v0.0.6
        env:
          - name: SLACK_WEBHOOK_URL
            valueFrom:
              secretKeyRef:
                name: forum-watcher-secret
                key: SLACK_WEBHOOK_URL
          - name: TZ
            value: Asia/Seoul
          - name: STATE_PATH
            value: /data/forum_notifier_state.json
          - name: PYTHONUNBUFFERED
            value: "1"
          # 댓글 알림을 원글 알림 스레드에 달 때 원글 메시지를 찾는 용도(읽기). Inquiry Inbox 봇 토큰, 봇은 #customer-forum 멤버
          - name: SLACK_BOT_TOKEN
            valueFrom:
              secretKeyRef:
                name: inquiry-inbox-secret
                key: SLACK_BOT_TOKEN
          - name: FORUM_CHANNEL_ID
            value: C0A62DGGGCA
        volumeMounts:
          - name: state
            mountPath: /data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: forum-watcher-state-pvc
